# An example plugin: the weather where you are, from Open-Meteo, which
# needs no account or key. A card on the control center, and
# `mochi ipc meteo show` for a forecast on the island. Mochi has a weather
# module of its own; this one shows how a plugin fetches from the web.

[plugin]
id = "meteo"
name = "Meteo"
version = "0.1.0"
description = "The weather from Open-Meteo: a control center card and a forecast on the island"
authors = ["Mochi"]
api = 1
homepage = "https://open-meteo.com"

[backend]
exec = "bin/meteo"
build = "cargo build --release --locked --target-dir target && install -Dm755 target/release/meteo bin/meteo"

[release]
asset = "meteo-{version}-{arch}-linux.tar.gz"

[[actions]]
name = "show"
description = "Show the forecast on the island"

[[actions]]
name = "refresh"
description = "Fetch the weather now"

[[contributions]]
target = "control-center"
kind = "card"
id = "now"
view = "Card"
title = "Meteo"
options = { span = 1, rows = 1 }
order = 70

# The same card as a desktop widget.
[[contributions]]
target = "widgets"
kind = "widget"
id = "now"
view = "Card"
title = "Meteo"
options = { size = [18, 9], min = [14, 7], max = [36, 16], description = "The temperature and the sky now, and the day's low and high" }

# How the settings panel shows the options in settings.toml: kinds and
# defaults come from there, choices and ranges from here.
[settings.units]
choices = ["metric", "imperial"]

[settings.refresh_minutes]
min = 5
max = 120

[settings.bubble]
choices = ["left", "center-left", "center-right", "right"]
optional = true
