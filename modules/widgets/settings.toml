# Widgets: views from any module on the desktop, under the windows. Where
# they are is in widgets.toml next to this file; `mochi ipc widgets edit`
# arranges them.
[module.widgets]
# The size of a grid cell, in pixels. Widgets snap to it, and widgets.toml
# counts in cells.
# grid = 16
# Let plugins' widgets go on the lock screen too. Like every widget there,
# they never get a key and can't unlock; they only show, and their buttons
# do nothing but play, pause and skip.
# lock_plugins = false
