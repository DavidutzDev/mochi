# Agents: coding agents like Claude Code on the island, working, waiting
# for you, or done. Their hooks run `mochi agents hook`; the module's page
# in the docs has the lines to add.
[module.agents]
# Minutes without news from a session before it goes, like an agent that
# was closed without saying so. 0 keeps them until they end.
# stale_minutes = 60
# A notice when a session needs you: a question, or a permission to give.
# waiting_notice = true
# A short notice when a session finishes.
# done_notice = true
# How long the notice of a session that needs you stays, in milliseconds,
# unless you answer first.
# waiting_ms = 8000
# How long the notice of a finished session stays, in milliseconds.
# done_ms = 3000
