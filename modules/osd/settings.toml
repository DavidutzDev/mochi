# OSD: shows volume, mute, the output device, microphone mute, Caps Lock and
# Num Lock as they change, from any source. Needs PipeWire or PulseAudio.
[module.osd]
# How long a notice stays, in milliseconds.
# timeout_ms = 1500
# Each kind of notice can be turned off.
# volume = true
# device = true
# microphone = true
# locks = true
