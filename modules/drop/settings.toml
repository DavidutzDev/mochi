# Drop: files dragged onto the island. It names what came and offers the
# actions that fit.
[module.drop]
# The actions to offer: zip (with zip or bsdtar), extract (bsdtar, unzip,
# tar or 7z), merge for PDFs (pdfunite or qpdf), convert, copy for the
# paths (wl-copy) and open (xdg-open). Images convert between PNG, JPEG,
# WebP, GIF, BMP, TIFF and ICO in Mochi itself; to SVG with vtracer, and
# HEIC, AVIF and images to PDF with ImageMagick. Videos and sound convert
# with ffmpeg, documents with LibreOffice, Markdown and HTML with pandoc.
# actions = ["zip", "extract", "merge", "convert", "copy", "open"]
