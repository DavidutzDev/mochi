# Launcher: `mochi ipc launcher toggle` searches your apps. Bind it to a key.
[module.launcher]
# The command that runs terminal apps when uwsm doesn't, like ["foot", "-e"].
# [] picks xdg-terminal-exec when installed, otherwise $TERMINAL -e.
# terminal = []
# The most results to list.
# max_results = 50

# Providers: where results come from. The built-ins are "apps", "calculator"
# (prefix "=", and plain math like 2+2 without it), "commands" (prefix ">";
# Shift+Enter runs one in a terminal), "files" (prefix "/"; Shift+Enter opens
# the folder) and the web searches below. Modules offer more: emoji with ":"
# and colors with "#". A
# [module.launcher.providers.<name>] section changes one, with any of:
#
#   enabled = false     # turn it off
#   prefix = "c"        # what a query starts with to ask only it; "" for none
#   order = 5           # lower shows first; apps are at 0
#   title = "Maths"     # the heading over its results
#
# A section with a command adds a script provider. It runs with the query
# as its last argument, and prints one JSON result per line, like
#   {"title": "Rust", "subtitle": "rust-lang.org", "open": "https://rust-lang.org"}
# with at most one of copy, type, open or run for what Enter does:
#
#   [module.launcher.providers.web]
#   prefix = "!w"
#   command = ["sh", "/path/to/web-search.sh"]
#   timeout_ms = 2000   # stopped after this long
#   pick = ["my-script", "--picked"]  # run with a result's "id" once picked

# Web searches, by the word after "!": "!w rust" searches DuckDuckGo. Built
# in are w (DuckDuckGo), g (Google), gh (GitHub), yt (YouTube), nix (NixOS
# packages) and wiki (Wikipedia). A section adds one, or changes or removes
# a built-in one with an empty url; %s is where the query goes:
#
#   [module.launcher.engines.crates]
#   title = "crates.io"
#   url = "https://crates.io/search?q=%s"

# The files provider searches an index of your home folder, built when the
# launcher starts and kept up to date through inotify, one watch per folder.
# Without enough watches (fs.inotify.max_user_watches), it's built again
# when the launcher opens and the index is 15 seconds old.
# Hidden files and folders are left out, and these:
#
#   [module.launcher.files]
#   roots = ["~"]
#   ignore = ["node_modules", "target", "__pycache__", "venv", "result", "dist", "build"]
#   max = 200000
