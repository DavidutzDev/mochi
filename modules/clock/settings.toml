# Clock: a panel with today, a calendar with reminders, the focus timer, a
# stopwatch and world clocks. Bind mochi ipc clock toggle to a key.
[module.clock]
# The tab it opens on: "today", "calendar", "timer", "stopwatch" or "world".
# tab = "today"
# The time zones on the World tab, up to 8.
# zones = ["Europe/London", "America/New_York", "Asia/Tokyo"]
# A "24" or a "12" hour clock.
# hours = "24"
# The day weeks start on in the calendar: "monday" or "sunday".
# first_day = "monday"
# Show the seconds on the Today tab.
# seconds = false
# How far through the day it is, on the Today tab: a "line" under the date,
# a "ring" around the clock, or "none".
# day_progress = "line"
# The shape the Today tab's clock sits in: "cookie", "circle", "pentagon",
# "clover", "burst", "hexagon", "octagon", "squircle", "pill" or "none".
# shape = "cookie"
# The stopwatch to the "tenths" of a second, or the "hundredths".
# precision = "tenths"
# How many of the stopwatch's past runs to keep, up to 50; 0 keeps none.
# history = 10
