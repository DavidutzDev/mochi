# Control center: the panel `mochi ipc control-center toggle` opens, with
# cards on its home and pages in a navbar.
[module.control-center]
# Its width, and the most its cards or a page take above the navbar, in
# logical pixels: the control center takes the height its content needs, up
# to that, and what is taller scrolls. It never grows past the screen.
# width = 860
# height = 480
# The home's cards in this order, as module/id like "network/status"; the
# ones not listed follow. The pencil in the control center's navbar
# arranges them.
# order = []
# Cards to leave off the home, the same way.
# hidden = []
