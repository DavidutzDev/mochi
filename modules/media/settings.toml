# Media: what's playing in any MPRIS player. A new track shows on the island,
# then the music becomes a bubble next to it.
[module.media]
# How long a new track shows the full player, in milliseconds.
# expand_ms = 4000
# Then how long the compact view stays before the music becomes a bubble.
# island_ms = 3000
# How long a paused player's bubble stays.
# paused_ms = 3000
# Players never shown, by name, like ["firefox"].
# ignore = []
# The progress line waves while a track plays. Off keeps it flat. The theme's
# waves, under Motion, can keep every wave flat whatever this says.
# wavy = true
# The progress line's color: "foreground", like the text, or "accent".
# line_color = "foreground"
# The now playing card's line seeks on a click or a drag, in the control
# center and on the desktop, as the island's player does.
# card_seeks = false
