# Performance: CPU, memory and GPU use and temperatures, and disk and
# network speeds. The hub has a Performance page with graphs and the
# busiest processes, which it can end; readings that stay high show a
# notice, and critical ones a bubble. The GPU comes from AMD's sysfs or
# NVIDIA's nvidia-smi. Disk and network speeds have no levels.
[module.performance]
# How often to read, in milliseconds; at least 500.
# interval_ms = 2000
# How long a reading must stay over a level before it counts, so a spike
# says nothing.
# sustain_seconds = 10
# Levels in percent of use: over `notice` shows a short notice once, naming
# the busiest process; over `critical` a red bubble stays until it comes
# down. 0 turns a level off; one left out of a table takes 85 and 95.
# cpu = { notice = 90, critical = 98 }
# memory = { notice = 85, critical = 95 }
# gpu = { notice = 95, critical = 0 }
# The same for the CPU's and the GPU's temperatures, in °C.
# temperature = { notice = 85, critical = 95 }
