# Capture: screenshots and recordings. `mochi ipc capture screenshot` and
# `mochi ipc capture record` ask what to capture; bind them to keys.
[module.capture]
# The mode the picker opens in: "region", "window", "screen" or "all",
# every screen as one image (screenshots only; recordings open on "region"
# instead). The island switches it while picking.
# mode = "region"
# Where screenshots go. "" is $XDG_PICTURES_DIR/Screenshots.
# screenshots = ""
# Where recordings go. "" is $XDG_VIDEOS_DIR/Recordings.
# recordings = ""
# File names, with strftime fields for the time.
# screenshot_name = "Screenshot from %Y-%m-%d %H-%M-%S"
# recording_name = "Recording from %Y-%m-%d %H-%M-%S"
# What Edit runs; the screenshot's path goes last. [] hides the button.
# editor = ["satty", "--filename"]
# The recorder, with any options of your own. It needs to speak
# gpu-screen-recorder's options.
# recorder = ["gpu-screen-recorder"]
# The video codec recordings start with, like "h264_vulkan" or "hevc". ""
# picks one: a hardware encoder when the GPU has one, otherwise Vulkan, and
# the CPU as a last resort.
# codec = ""
# The frame rate and the resolution recordings start with; the picker
# steps through 15, 30, 60, 90 and 120 fps, and "native", "480p", "720p",
# "1080p" and "1440p". A resolution scales the video down to that many lines,
# keeping its shape, and never up.
# framerate = 60
# resolution = "native"
# The file a recording goes in: "mp4", "mkv", which survives the recorder
# stopping hard, or "webm", which takes only AV1, VP9 and VP8. The picker
# steps through these and through the codecs the recorder has.
# container = "mp4"
# The sound to record, and the microphone the picker can add. "" for none.
# audio = "default_output"
# microphone = "default_input"
# Whether the picker starts with the desktop audio and the microphone on.
# Its bar switches either for one recording.
# record_audio = true
# record_microphone = false
# Copy every capture to the clipboard: screenshots as images, recordings
# as files.
# copy = true
# How long the island shows a capture, in milliseconds.
# preview_ms = 6000
