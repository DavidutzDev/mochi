# Notifications: the notification daemon. If another one runs, Mochi waits
# and takes over when it stops.
[module.notifications]
# How long a popup stays unless the app asks for another time, in
# milliseconds.
# timeout_ms = 5000
# How many missed notifications to keep.
# history = 50
# "replace": a new popup from an app replaces the one shown, so a burst
# shows only the latest. "stack": each shows in turn.
# same_app = "replace"
# Keep the history across restarts, in $XDG_STATE_HOME/mochi/, readable
# only by you. Their buttons don't come back, since the apps that sent
# them can't answer anymore.
# save_history = true
# Read the Markdown some apps, like Discord, put in bodies: **bold**,
# *italic*, __underline__, ~~strike~~, `code`, [links](https://…) and
# ||spoilers||. Plain https:// links become links too.
# markdown = true
# Play the sound an app asks for when its notification pops up, like a
# chat app's message sound. Only notifications that ask make one, and none
# during do not disturb.
# sounds = true
# What plays a sound file, with any options of your own; the file goes
# last. [] uses pw-play or paplay for files, and canberra-gtk-play for
# sounds from the theme. Like: sound_command = ["mpv", "--really-quiet"]
# sound_command = []
# The sound theme names like "message-new-instant" come from, when
# canberra-gtk-play isn't installed or sound_command is set. Sounds it
# lacks come from "freedesktop".
# sound_theme = "freedesktop"
