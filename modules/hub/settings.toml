# Hub: the panel `mochi ipc hub toggle` opens, with cards on its home and
# pages in a navbar.
[module.hub]
# Its width, and the most its cards or a page take above the navbar, in
# logical pixels: the hub takes the height its content needs, up to that,
# and what is taller scrolls. It never grows past the screen.
# width = 860
# height = 480
# The home's cards in this order, as module/id like "network/status"; the
# ones not listed follow. The pencil in the hub's navbar arranges them.
# order = []
# Cards to leave off the home, the same way.
# hidden = []
