[package]
name = "mochid"
description = "The Mochi daemon: owns state and supervises the Quickshell UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["demo"]
# Demo views and actions for trying the island. Enabled per user in config.toml.
demo = ["dep:mochi-module-demo"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
mochi-core.workspace = true
mochi-plugins.workspace = true
mochi-module-audio.workspace = true
mochi-module-battery.workspace = true
mochi-module-bluetooth.workspace = true
mochi-module-capture.workspace = true
mochi-module-clipboard.workspace = true
mochi-module-demo = { workspace = true, optional = true }
mochi-module-hub.workspace = true
mochi-module-colors.workspace = true
mochi-module-emoji.workspace = true
mochi-module-notes.workspace = true
mochi-module-widgets.workspace = true
mochi-module-idle.workspace = true
mochi-module-launcher.workspace = true
mochi-module-media.workspace = true
mochi-module-network.workspace = true
mochi-module-notifications.workspace = true
mochi-module-performance.workspace = true
mochi-module-osd.workspace = true
mochi-module-power.workspace = true
mochi-module-settings.workspace = true
mochi-module-share.workspace = true
mochi-module-tour.workspace = true
mochi-module-tray.workspace = true
mochi-module-workspaces.workspace = true
mochi-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[lints]
workspace = true
