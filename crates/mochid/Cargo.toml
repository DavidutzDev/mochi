[package]
name = "mochid"
description = "The Mochi daemon: owns state and supervises the Quickshell UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["demo"]
# Demo views and actions for trying the island. Enabled per user in config.toml.
demo = ["dep:mochi-module-demo"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
mochi-core.workspace = true
mochi-module-demo = { workspace = true, optional = true }
mochi-module-idle.workspace = true
mochi-module-osd.workspace = true
mochi-module-workspaces.workspace = true
mochi-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
libc.workspace = true

[lints]
workspace = true
