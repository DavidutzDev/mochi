[theme]
id = "tokyo-night"
name = "Tokyo Night"
version = "1.0.0"
mochi = "0.0.7"
description = "Tokyo Night, and Day when light"
authors = ["Mochi"]
homepage = "https://github.com/enkia/tokyo-night-vscode-theme"

[dark]
background = "#f516161e"
surface    = "#1a1b26"
raised     = "#292e42"
highlight  = "#414868"
foreground = "#c0caf5"
muted      = "#787c99"
accent     = "#7aa2f7"
on_accent  = "#16161e"
danger     = "#f7768e"
success    = "#9ece6a"
border     = "#0dffffff"
shadow     = "#59000000"

[light]
background = "#f5e1e2e7"
surface    = "#d5d6db"
raised     = "#c4c8da"
highlight  = "#b6bbd2"
foreground = "#343b58"
muted      = "#6a6f8e"
accent     = "#2e7de9"
on_accent  = "#e1e2e7"
danger     = "#f52a65"
success    = "#587539"
border     = "#1a000000"
shadow     = "#26000000"
