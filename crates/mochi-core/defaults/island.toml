# The island.
[island]
# Which monitor panels open on: the launcher, the hub, the clipboard and the
# other views you type into. "focus" is the monitor with keyboard focus,
# "pointer" the one under the mouse (on Hyprland; elsewhere it's "focus"),
# and "all" every monitor at once.
# panels = "focus"
# Which monitor everything else shows on: notifications, the volume, the
# media card and every other notice. "all" is every monitor's island at
# once; "focus" and "pointer" as for panels, while the other monitors keep
# the idle island.
# notices = "all"
# What a click outside the island closes. "all" is whatever the island
# shows, except the idle island and quick notices like the volume; the
# click closes it instead of reaching the window under it. "expanded" is
# only views you opened with a click, and the ones you type into.
# click_outside = "all"
