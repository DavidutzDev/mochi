[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
mochi-protocol = { path = "crates/mochi-protocol" }
mochi-core = { path = "crates/mochi-core" }
mochi-module-demo = { path = "modules/demo" }
mochi-module-idle = { path = "modules/idle" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
# Libraries log through tracing. Binaries opt back in where they print.
print_stdout = "warn"
print_stderr = "warn"
