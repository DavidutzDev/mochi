[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
mochi-protocol = { path = "crates/mochi-protocol" }
mochi-compositor = { path = "crates/mochi-compositor" }
mochi-core = { path = "crates/mochi-core" }
mochi-module-audio = { path = "modules/audio" }
mochi-module-capture = { path = "modules/capture" }
mochi-module-clipboard = { path = "modules/clipboard" }
mochi-module-demo = { path = "modules/demo" }
mochi-module-hub = { path = "modules/hub" }
mochi-module-idle = { path = "modules/idle" }
mochi-module-launcher = { path = "modules/launcher" }
mochi-module-media = { path = "modules/media" }
mochi-module-notifications = { path = "modules/notifications" }
mochi-module-osd = { path = "modules/osd" }
mochi-module-power = { path = "modules/power" }
mochi-module-share = { path = "modules/share" }
mochi-module-workspaces = { path = "modules/workspaces" }

anyhow = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
enumflags2 = "0.7"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
include_dir = "0.7"
libc = "0.2"
libpulse-binding = "2"
nucleo-matcher = "0.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"
zstd = "0.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
# Libraries log through tracing. Binaries opt back in where they print.
print_stdout = "warn"
print_stderr = "warn"

# Screenshots compress PNGs: unoptimized, that takes seconds in `cargo run`.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
